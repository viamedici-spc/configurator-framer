name: Build and Publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  configurator-framer:
    permissions:
      contents: read
      id-token: write
    uses: viamedici-spc/github-ci/.github/workflows/build-bun.yml@feature/v4
    with:
      project-dir: packages/configurator-framer

  configurator-framer-bundle:
    permissions:
      contents: read
      id-token: write
    uses: viamedici-spc/github-ci/.github/workflows/build-bun.yml@feature/v4
    with:
      project-dir: packages/configurator-framer-bundle